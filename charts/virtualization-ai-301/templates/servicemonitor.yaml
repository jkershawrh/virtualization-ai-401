{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: virtualization-ai-301-adapter
  labels: {{- include "virtualization-ai-301.labels" . | nindent 4 }}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: virtualization-ai-301-adapter}}
  endpoints: [{port: http, path: /metrics, interval: {{ .Values.monitoring.serviceMonitor.interval | quote }}}]
{{- end }}
