name: Virtualization + AI 401 immutable images
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character source revision
        required: true
        type: string
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: virtualization-ai-401-release-${{ inputs.expected_sha }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.expected_sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Refuse revision drift
        env: {EXPECTED_SHA: "${{ inputs.expected_sha }}"}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - run: npm ci --ignore-scripts
      - run: python3 -m pip install --requirement requirements-test.txt
      - run: npm run check
      - run: npm audit --audit-level=high
  release:
    needs: qualify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {component: presentation, file: Containerfile, image: virtualization-ai-401-presentation}
          - {component: adapter, file: workload/Containerfile, image: virtualization-ai-401-adapter}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.expected_sha }}"}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Build Linux AMD64 candidate
        run: docker buildx build --platform linux/amd64 --file "${{ matrix.file }}" --label "org.opencontainers.image.revision=${{ inputs.expected_sha }}" --tag "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.expected_sha }}" --load .
      - name: Full vulnerability inventory and zero HIGH/CRITICAL gate
        uses: anchore/scan-action@v6
        with: {image: "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.expected_sha }}", severity-cutoff: high, fail-build: true, output-format: json, output-file: "vulnerability-${{ matrix.component }}.json"}
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with: {image: "ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.expected_sha }}", format: spdx-json, output-file: "sbom-${{ matrix.component }}.spdx.json", upload-artifact: false}
      - name: Publish and exact-digest pull
        id: publish
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.expected_sha }}"
          docker push "$image"
          digest_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          test -n "$digest_ref"
          docker image rm "$image"
          docker pull "$digest_ref"
          test "$(docker inspect --format='{{.Architecture}}' "$digest_ref")" = amd64
          test "$(docker inspect --format='{{index .Config.Labels "org.opencontainers.image.revision"}}' "$digest_ref")" = "${{ inputs.expected_sha }}"
          printf 'digest_ref=%s\n' "$digest_ref" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$digest_ref" > "image-${{ matrix.component }}.txt"
      - uses: sigstore/cosign-installer@v3.8.2
      - name: Keyless sign and attest SBOM plus SLSA provenance
        env: {DIGEST_REF: "${{ steps.publish.outputs.digest_ref }}"}
        run: |
          set -euo pipefail
          cosign sign --yes "$DIGEST_REF"
          cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.component }}.spdx.json" "$DIGEST_REF"
          printf '{"builder":{"id":"%s"},"buildType":"https://github.com/Attestations/GitHubActionsWorkflow@v1","invocation":{"configSource":{"uri":"git+%s/%s","digest":{"sha1":"%s"},"entryPoint":".github/workflows/release-images.yml"}},"metadata":{"buildInvocationId":"%s"},"materials":[]}\n' "${{ github.workflow_ref }}" "${{ github.server_url }}" "${{ github.repository }}" "${{ inputs.expected_sha }}" "${{ github.run_id }}" > "provenance-${{ matrix.component }}.json"
          cosign attest --yes --type slsaprovenance --predicate "provenance-${{ matrix.component }}.json" "$DIGEST_REF"
      - name: Verify signature and attestations
        env: {DIGEST_REF: "${{ steps.publish.outputs.digest_ref }}"}
        run: |
          set -euo pipefail
          identity="${{ github.server_url }}/${{ github.repository }}/.github/workflows/release-images.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity="$identity" --certificate-oidc-issuer="$issuer" "$DIGEST_REF" > "signature-verification-${{ matrix.component }}.json"
          cosign verify-attestation --type spdxjson --certificate-identity="$identity" --certificate-oidc-issuer="$issuer" "$DIGEST_REF" > "sbom-verification-${{ matrix.component }}.json"
          cosign verify-attestation --type slsaprovenance --certificate-identity="$identity" --certificate-oidc-issuer="$issuer" "$DIGEST_REF" > "provenance-verification-${{ matrix.component }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: "virtualization-ai-401-${{ matrix.component }}-${{ inputs.expected_sha }}"
          retention-days: 90
          path: |
            image-${{ matrix.component }}.txt
            vulnerability-${{ matrix.component }}.json
            sbom-${{ matrix.component }}.spdx.json
            provenance-${{ matrix.component }}.json
            *-verification-${{ matrix.component }}.json
